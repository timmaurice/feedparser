name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
