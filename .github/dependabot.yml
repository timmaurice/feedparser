# This is the configuration file for Dependabot. You can find configuration information below.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# Note: Dependabot has a configurable max open PR limit of 5

version: 2
updates:
  # Maintain dependencies for our GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    # feedparser stays on the version Home Assistant core pins for its own
    # feedreader integration (homeassistant/components/feedreader/manifest.json).
    # The official image installs requirements_all.txt, so that version is
    # already there: pinning the same one means nothing is installed at startup,
    # and a user of both integrations does not get two exact pins fighting over
    # one package. Move it when core moves feedreader.
    ignore:
      - dependency-name: "feedparser"
